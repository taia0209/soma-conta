<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soma por Conta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1rem;
  }
  h1 { font-size: 2rem; margin-bottom: .5rem; color: #38bdf8; }
  .sub { color: #94a3b8; margin-bottom: 2rem; font-size: .95rem; }
  .card {
    background: #1e293b; border-radius: 16px; padding: 2rem;
    width: 100%; max-width: 700px; box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  .drop-zone {
    border: 2px dashed #475569; border-radius: 12px; padding: 3rem 1rem;
    text-align: center; cursor: pointer; transition: all .2s;
    color: #94a3b8; position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #38bdf8; background: rgba(56,189,248,.05); color: #38bdf8;
  }
  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop-zone .icon { font-size: 3rem; margin-bottom: .5rem; }
  .drop-zone p { font-size: .95rem; }
  .drop-zone .formats { font-size: .8rem; color: #64748b; margin-top: .5rem; }

  .config {
    display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;
  }
  .config label {
    flex: 1; min-width: 200px; font-size: .85rem; color: #94a3b8;
  }
  .config select {
    width: 100%; padding: .6rem .8rem; margin-top: .3rem;
    background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    color: #e2e8f0; font-size: .9rem; outline: none;
  }
  .config select:focus { border-color: #38bdf8; }

  .btn {
    display: inline-block; margin-top: 1.5rem; padding: .8rem 2rem;
    background: #38bdf8; color: #0f172a; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: all .2s;
    width: 100%;
  }
  .btn:hover { background: #7dd3fc; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.secondary {
    background: #334155; color: #e2e8f0; margin-top: .8rem;
  }
  .btn.secondary:hover { background: #475569; }

  .result { margin-top: 2rem; display: none; }
  .result.show { display: block; }

  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { padding: .7rem 1rem; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  td.valor { text-align: right; font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 700; color: #38bdf8; border-top: 2px solid #38bdf8; font-size: 1.05rem; }
  tr:nth-child(even) { background: rgba(255,255,255,.02); }

  .info { color: #94a3b8; font-size: .85rem; margin-top: 1rem; }
  .erro { color: #f87171; margin-top: 1rem; font-size: .9rem; }
  .ok { color: #4ade80; margin-top: 1rem; font-size: .9rem; }

  footer { margin-top: 3rem; color: #475569; font-size: .8rem; }
</style>
</head>
<body>
  <h1>📊 Soma por Conta</h1>
  <p class="sub">Envie sua planilha — retorna com as mesmas colunas, conta em texto</p>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">
      <div class="icon">📁</div>
      <p>Arraste o arquivo aqui ou <strong>clique para selecionar</strong></p>
      <p class="formats">CSV, XLSX</p>
    </div>

    <div class="config">
      <label>Coluna da Conta
        <select id="colConta"><option value="">Selecione um arquivo primeiro</option></select>
      </label>
      <label>Coluna do Valor
        <select id="colValor"><option value="">Selecione um arquivo primeiro</option></select>
      </label>
    </div>

    <button class="btn" id="btnEnviar" disabled>📊 Somar e Gerar Planilha</button>
    <button class="btn secondary" id="btnExportXlsx" style="display:none">⬇️ Baixar Planilha (.xlsx)</button>

    <div class="erro" id="erro"></div>
    <div class="ok" id="ok"></div>

    <div class="result" id="result">
      <h3 style="color:#38bdf8; margin-bottom:.3rem">Prévia</h3>
      <p class="info" id="infoArquivo"></p>
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer>Soma por Conta — 100% no navegador</footer>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const btnEnviar = document.getElementById('btnEnviar');
const btnExportXlsx = document.getElementById('btnExportXlsx');
const erro = document.getElementById('erro');
const ok = document.getElementById('ok');
const result = document.getElementById('result');
const thead = document.getElementById('thead');
const tbody = document.getElementById('tbody');
const infoArquivo = document.getElementById('infoArquivo');
const selConta = document.getElementById('colConta');
const selValor = document.getElementById('colValor');

let arquivoNome = '';
let dadosOriginais = [];
let colunasOriginais = [];
let workbookOriginal = null;

// ── Drag & Drop ──
['dragenter','dragover'].forEach(e => dropZone.addEventListener(e, ev => {
  ev.preventDefault(); dropZone.classList.add('dragover');
}));
['dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => {
  ev.preventDefault(); dropZone.classList.remove('dragover');
}));
dropZone.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (f) handleFile(f);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

// ── Ler arquivo ──
function handleFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  if (!['csv','xlsx','xls'].includes(ext)) {
    erro.textContent = 'Formato não suportado. Use CSV ou XLSX.';
    return;
  }
  erro.textContent = '';
  ok.textContent = '';
  result.classList.remove('show');
  btnExportXlsx.style.display = 'none';
  arquivoNome = f.name;

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      workbookOriginal = XLSX.read(data, { type: 'array' });
      const ws = workbookOriginal.Sheets[workbookOriginal.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if (!json.length) {
        erro.textContent = 'Planilha vazia!';
        return;
      }

      colunasOriginais = Object.keys(json[0]);
      dadosOriginais = json;
      preencherSelects(colunasOriginais);
      ok.textContent = `✅ ${f.name} carregado — ${json.length} linhas, ${colunasOriginais.length} colunas`;
      btnEnviar.disabled = false;

    } catch (err) {
      erro.textContent = 'Erro ao ler arquivo: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(f);
}

function preencherSelects(colunas) {
  selConta.innerHTML = '<option value="">— Selecione —</option>';
  selValor.innerHTML = '<option value="">— Selecione —</option>';

  colunas.forEach(c => {
    selConta.innerHTML += `<option value="${c}">${c}</option>`;
    selValor.innerHTML += `<option value="${c}">${c}</option>`;
  });

  // Auto-detect
  const lower = colunas.map(c => c.toLowerCase());
  const contaIdx = lower.findIndex(c =>
    ['conta','categoria','category','nome','description','descrição','classificação'].includes(c));
  const valorIdx = lower.findIndex(c =>
    ['valor','value','amount','total','preço','preco','montante','debito','crédito'].includes(c));

  if (contaIdx >= 0) selConta.value = colunas[contaIdx];
  if (valorIdx >= 0) selValor.value = colunas[valorIdx];
}

// ── Processar ──
btnEnviar.addEventListener('click', () => {
  const colC = selConta.value;
  const colV = selValor.value;

  if (!colC || !colV) {
    erro.textContent = 'Selecione as duas colunas (Conta e Valor).';
    return;
  }
  erro.textContent = '';

  // Agrupa e soma, contando linhas por conta e juntando info das outras colunas
  const totais = {};
  const contagem = {};
  const outrasColunas = {}; // { conta: { col: [val1, val2, ...] } }
  let count = 0;

  dadosOriginais.forEach((row, idx) => {
    const conta = String(row[colC] ?? '').trim();
    if (!conta) return;

    let v = String(row[colV] ?? '').trim();
    v = v.replace(/R\$\s?/g, '').replace(/\s/g, '');
    if (v.includes(',') && v.includes('.')) {
      v = v.replace(/\./g, '').replace(',', '.');
    } else if (v.includes(',')) {
      v = v.replace(',', '.');
    }
    const num = parseFloat(v);
    if (isNaN(num)) return;

    totais[conta] = (totais[conta] || 0) + num;
    contagem[conta] = (contagem[conta] || 0) + 1;
    count++;

    // Junta valores das outras colunas
    if (!outrasColunas[conta]) outrasColunas[conta] = {};
    colunasOriginais.forEach(c => {
      if (c === colC || c === colV) return;
      const raw = row[c];
      const val = (raw !== null && raw !== undefined) ? String(raw).trim() : '';
      if (!val) return;
      if (!outrasColunas[conta][c]) outrasColunas[conta][c] = [];
      if (!outrasColunas[conta][c].includes(val)) {
        outrasColunas[conta][c].push(val);
      }
    });
  });

  // Debug: mostra no console o que foi coletado
  console.log('Colunas originais:', colunasOriginais);
  console.log('Dados originais (primeira linha):', dadosOriginais[0]);
  console.log('Outras colunas coletadas:', outrasColunas);

  if (!count) {
    erro.textContent = 'Nenhum valor válido encontrado. Verifique as colunas.';
    return;
  }

  // Monta resultado com as mesmas colunas + coluna de linhas juntadas
  const colLinhas = 'Linhas Juntadas';
  const todasColunas = [...colunasOriginais, colLinhas];
  const resultadoLinhas = [];
  const sorted = Object.entries(totais).sort((a, b) => a[0].localeCompare(b[0]));

  sorted.forEach(([conta, total]) => {
    const linha = {};
    colunasOriginais.forEach(c => {
      if (c === colC) {
        linha[c] = conta;
      } else if (c === colV) {
        linha[c] = Math.round(total * 100) / 100;
      } else if (outrasColunas[conta] && outrasColunas[conta][c]) {
        // Junta os valores com " | " quando tem mais de um
        linha[c] = outrasColunas[conta][c].join(' | ');
      } else {
        linha[c] = '';
      }
    });
    linha[colLinhas] = contagem[conta];
    resultadoLinhas.push(linha);
  });

  // ── Prévia na tela ──
  thead.innerHTML = '<tr>' + todasColunas.map(c =>
    `<th>${c}</th>`).join('') + '</tr>';
  tbody.innerHTML = '';

  resultadoLinhas.forEach(row => {
    const tr = document.createElement('tr');
    todasColunas.forEach(c => {
      const td = document.createElement('td');
      const val = row[c];
      if (c === colV && typeof val === 'number') {
        td.className = 'valor';
        td.textContent = 'R$ ' + val.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
      } else if (c === colLinhas) {
        td.style.textAlign = 'center';
        td.textContent = val;
      } else {
        td.textContent = val;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  // Linha do total geral
  const totalGeral = sorted.reduce((s, [, v]) => s + v, 0);
  const totalLinhas = Object.values(contagem).reduce((s, v) => s + v, 0);
  const trTotal = document.createElement('tr');
  trTotal.className = 'total';
  todasColunas.forEach(c => {
    const td = document.createElement('td');
    if (c === colC) {
      td.textContent = 'TOTAL GERAL';
    } else if (c === colV) {
      td.className = 'valor';
      td.textContent = 'R$ ' + totalGeral.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    } else if (c === colLinhas) {
      td.style.textAlign = 'center';
      td.textContent = totalLinhas;
    }
    trTotal.appendChild(td);
  });
  tbody.appendChild(trTotal);

  infoArquivo.textContent = `${count} valores somados → ${resultadoLinhas.length} contas`;
  result.classList.add('show');
  btnExportXlsx.style.display = 'block';

  // ── Gerar XLSX para download ──
  window._resultadoLinhas = resultadoLinhas;
  window._colC = colC;
  window._todasColunas = todasColunas;
});

// ── Exportar XLSX ──
btnExportXlsx.addEventListener('click', () => {
  const resultadoLinhas = window._resultadoLinhas;
  const colC = window._colC;
  const todasColunas = window._todasColunas;

  // Cria worksheet com os dados
  const ws = XLSX.utils.json_to_sheet(resultadoLinhas, { skipHeader: false });

  // Força a coluna de conta como texto (t)
  const colIdx = colunasOriginais.indexOf(colC);
  const colLetter = XLSX.utils.encode_col(colIdx);

  // Marca todas as células da coluna de conta como texto
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let r = range.s.r + 1; r <= range.e.r; r++) {
    const addr = colLetter + (r + 1);
    if (ws[addr]) {
      ws[addr].t = 's'; // tipo string
      ws[addr].z = '@'; // formato texto
    }
  }

  // Ajusta largura das colunas
  ws['!cols'] = todasColunas.map(c => ({
    wch: Math.max(c.length + 2, c === colC ? 20 : 15)
  }));

  // Cria workbook e baixa
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Soma por Conta');

  const nomeBase = arquivoNome.replace(/\.[^.]+$/, '') || 'planilha';
  XLSX.writeFile(wb, `${nomeBase}_soma.xlsx`);
});
</script>
</body>
</html>
